name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Lint
        run: python -m ruff check src tests

      - name: Test with branch coverage
        run: python -m pytest --cov=marvin_pilot --cov-report=term

      - name: Build wheel and source distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: python -m build

      - name: Verify packaged visualizer assets
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: python tools/verify_distribution.py dist/*.whl dist/*.tar.gz

  browser:
    name: Chromium visualizer tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Exercise the visualizer in Chromium
        env:
          MARVIN_PILOT_BROWSER_TESTS: "1"
        run: python -m pytest -m browser tests/browser
